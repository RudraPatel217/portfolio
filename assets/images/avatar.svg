<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="400" height="400" rx="200" fill="url(#bgGrad)" />
  
  <!-- Outer Tech Ring -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#glowGrad)" stroke-width="3" stroke-dasharray="12 6" opacity="0.8" />
  <circle cx="200" cy="200" r="175" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.3" />

  <!-- Background Ambient Glow -->
  <circle cx="200" cy="180" r="110" fill="#38bdf8" opacity="0.12" filter="url(#glowFilter)" />

  <!-- Stylized Developer Silhouette / Cyber Avatar -->
  <!-- Shoulders & Torso with Cyber Hoodie -->
  <path d="M90 380 C90 300, 140 260, 200 260 C260 260, 310 300, 310 380 Z" fill="#0f172a" stroke="url(#glowGrad)" stroke-width="2" />
  <path d="M140 270 L200 340 L260 270" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6" />
  <path d="M200 340 L200 400" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4" />

  <!-- Neck -->
  <rect x="180" y="220" width="40" height="45" rx="10" fill="#1e293b" />

  <!-- Head / Face -->
  <ellipse cx="200" cy="170" rx="58" ry="72" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />

  <!-- Modern Hair -->
  <path d="M142 160 C140 100, 180 80, 220 82 C255 85, 265 110, 258 150 C245 120, 230 110, 200 110 C170 110, 150 130, 142 160 Z" fill="#38bdf8" opacity="0.9" />

  <!-- Cyber Visor / Smart Glasses -->
  <rect x="152" y="150" width="96" height="26" rx="8" fill="#0284c7" opacity="0.3" />
  <rect x="152" y="150" width="96" height="26" rx="8" fill="none" stroke="#38bdf8" stroke-width="2" filter="url(#glowFilter)" />
  <line x1="160" y1="163" x2="240" y2="163" stroke="#f0f9ff" stroke-width="2" stroke-linecap="round" />
  <circle cx="170" cy="163" r="3" fill="#ffffff" />
  <circle cx="230" cy="163" r="3" fill="#ffffff" />

  <!-- Tech Headset -->
  <path d="M135 155 C132 125, 160 105, 200 105 C240 105, 268 125, 265 155" fill="none" stroke="#64748b" stroke-width="6" stroke-linecap="round" />
  <rect x="130" y="150" width="14" height="38" rx="6" fill="#38bdf8" stroke="#ffffff" stroke-width="1" />
  <rect x="256" y="150" width="14" height="38" rx="6" fill="#38bdf8" stroke="#ffffff" stroke-width="1" />

  <!-- Subtle Smile -->
  <path d="M188 215 Q200 223 212 215" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />

  <!-- Floating Tech Data Nodes -->
  <circle cx="85" cy="140" r="4" fill="#38bdf8" filter="url(#glowFilter)" />
  <circle cx="315" cy="140" r="4" fill="#6366f1" filter="url(#glowFilter)" />
  <line x1="85" y1="140" x2="130" y2="160" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 3" opacity="0.4" />
  <line x1="315" y1="140" x2="270" y2="160" stroke="#6366f1" stroke-width="1" stroke-dasharray="3 3" opacity="0.4" />
</svg>
