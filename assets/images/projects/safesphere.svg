    <rect x="20" y="280" width="258" height="26" rx="5" fill="#f43f5e"/>
    <text x="65" y="297" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="700">EXPLORE TECHFUSION DEMO ↗</text>
